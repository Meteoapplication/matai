name: Prévisions Mata'i

# ═══════════════════════════════════════════════════════════════════════
# DEUX RYTHMES DANS UN SEUL FLUX
#
# Les prévisions et les nuages n'ont pas la même durée de vie.
#
#   Les prévisions viennent de modèles qui ne sortent que deux à quatre
#   fois par jour. Les recalculer sans arrêt ne les rendrait pas plus
#   justes — ça brûlerait du quota pour rien. Une fois par heure suffit.
#
#   Les nuages, eux, sont une photo. GOES-18 en prend une toutes les dix
#   minutes. Une photo d'il y a une heure ne sert à rien à quelqu'un qui
#   décide s'il sort maintenant.
#
# Donc : le flux passe toutes les vingt minutes. Au premier passage de
# l'heure il refait tout ; aux deux autres il ne va chercher que les
# images du satellite. Un déclenchement manuel refait toujours tout.
# ═══════════════════════════════════════════════════════════════════════
#
# GitHub n'est pas ponctuel à la minute : un passage peut décaler de dix à
# vingt minutes quand leurs serveurs sont chargés. L'app affiche l'âge réel
# de chaque image, jamais une fraîcheur supposée.
#
# ═════════════════════════════════════════════════════════════════════
# CE QU'ON A MESURÉ LE 26 AOÛT, ET POURQUOI ON EST REVENU À UNE HEURE
#
# Objectif de départ : rafraîchir les nuages toutes les vingt minutes.
# Deux tentatives, deux échecs, mesurés et pas supposés :
#
#   `*/20 * * * *`          → 0 déclenchement en 1 h 20
#   `5,25,45 * * * *`       → 0 déclenchement en 1 h 00 (3 créneaux ratés)
#   `0 * * * *`  (l'ancien) → 10 déclenchements d'affilée, aucun raté
#
# Le planificateur de GitHub est « au mieux » et sacrifie les cadences
# rapprochées quand la charge monte. Plutôt que de laisser un réglage
# ambitieux qui ne publie jamais rien, on remet celui qui a fait ses
# preuves sur CE dépôt.
#
# Conséquence assumée : l'image la plus fraîche a entre 15 et 75 minutes.
# C'est six fois mieux que les outils qui sortent toutes les 6 heures,
# et trois fois moins bien que ce qu'on visait.
#
# Pour descendre vraiment à vingt minutes, il faut un minuteur fiable
# hors de GitHub (Cloudflare Workers en fait un par minute, gratuitement)
# qui appelle ce flux par workflow_dispatch. Cela demande un compte
# Cloudflare et un jeton GitHub : c'est une décision de Gabin, pas une
# décision technique.
# ═════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Deux passages qui se chevauchent se marcheraient sur les pieds au moment
# de publier. On les met à la queue leu leu.
concurrency:
  group: publication-matai
  cancel-in-progress: false

jobs:
  previsions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      # ─────────────────────────────────────────────────────────────────
      # On récupère ce qui est déjà en ligne AVANT de fabriquer.
      #
      # Sans ça, chaque passage repartirait de zéro et retéléchargerait
      # les douze images de la boucle — deux cent quarante mégaoctets pour
      # rien. Là, on ne va chercher que les deux qui manquent.
      # ─────────────────────────────────────────────────────────────────
      - name: Récupérer ce qui est déjà publié
        run: |
          rm -rf paquets
          if git fetch --depth=1 origin site; then
            git checkout FETCH_HEAD -- paquets || echo "branche site encore vide"
            git reset --quiet
          else
            echo "première publication : rien à récupérer"
          fi
          echo "images en réserve : $(ls paquets/nuages/anim/*.jpg 2>/dev/null | wc -l)"

      - name: Fabriquer
        env:
          OPEN_METEO_CLE: ${{ secrets.OPEN_METEO_CLE }}
          METEOFRANCE_CLE: ${{ secrets.METEOFRANCE_CLE }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%M)" -lt 20 ]; then
            echo "── passage complet : prévisions + nuages ──"
            node build.mjs
          else
            echo "── passage court : nuages seulement ──"
            node animation.mjs
          fi

      # ─────────────────────────────────────────────────────────────────
      # Publication sur une branche à commit unique.
      #
      # Les images changent toutes les vingt minutes. Versionner ça dans
      # l'historique ferait grossir le dépôt d'une trentaine de mégaoctets
      # par jour — il serait ingérable en un mois.
      #
      # On écrase donc « site » avec un commit sans parent à chaque fois.
      # Le dépôt garde la taille de son contenu, pour toujours. Le code
      # source, lui, reste sur main avec son historique intact.
      # ─────────────────────────────────────────────────────────────────
      - name: Publier
        run: |
          git config user.name  "Mata'i"
          git config user.email "matai@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan publication
          git reset --quiet
          git add -f .nojekyll paquets
          git commit -q -m "Site du $(date -u '+%d/%m/%Y %H:%M') UTC"
          git push --force origin publication:site
          echo "publié : $(du -sh paquets | cut -f1)"
