name: Prévisions Mata'i

# Toutes les heures, à l'heure ronde. Coût nul sur un dépôt public.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previsions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Fabriquer les paquets
        env:
          OPEN_METEO_CLE: ${{ secrets.OPEN_METEO_CLE }}
          METEOFRANCE_CLE: ${{ secrets.METEOFRANCE_CLE }}
        run: node build.mjs

      - name: Publier les paquets
        run: |
          git config user.name  "Mata'i"
          git config user.email "matai@users.noreply.github.com"
          git add paquets/
          git diff --staged --quiet || git commit -m "Prévisions du $(date -u '+%d/%m/%Y %H:%M') UTC"
          git pull --rebase --autostash origin main
          git push
