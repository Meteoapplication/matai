name: Prévisions Mata'i

# ═══════════════════════════════════════════════════════════════════════
# ⚠️  UN SEUL RYTHME, ET UN PASSAGE COMPLET À CHAQUE FOIS.
#
# CE FLUX A LAISSÉ LE SITE FIGÉ TRENTE HEURES, AU VERT.
#
# Il portait autrefois deux rythmes dans un seul flux : passage toutes les
# vingt minutes, complet au premier de l'heure, nuages seulement aux deux
# autres. Le partage se faisait sur la minute :
#
#     if [ … ] || [ "$(date -u +%M)" -lt 20 ]; then node build.mjs
#     else                                          node animation.mjs
#
# Le 26 août, la cadence `*/20` a été abandonnée — GitHub ne la déclenchait
# jamais — et le flux est revenu à `0 * * * *`. Mais la condition sur la
# minute, elle, est restée. Or GitHub n'est pas ponctuel : le passage
# programmé du 28 août à 00 h 00 UTC s'est déclenché à 00 h 31.
#
# Trente et une minutes, donc « pas moins de vingt », donc :
#
#     — passage court : nuages seulement —
#
# Les images du satellite se sont rafraîchies, les prévisions non. Le site
# a servi le paquet du 26 août pendant deux jours, avec une coche verte à
# chaque passage et pas un message d'erreur. Relevé dans le journal du
# passage #28, ligne 13.
#
# La condition attendait une cadence qui n'existe plus, et transformait le
# retard de GitHub — chose ordinaire, documentée plus bas — en panne
# silencieuse. C'est la pire forme : rien n'échoue, donc rien n'alerte.
#
# Avec un seul passage par heure, il n'y a plus de choix à faire :
# `build.mjs` fait tout, y compris les nuages, l'animation et la
# projection. `animation.mjs` reste utilisable à la main pour ne
# rafraîchir que les images.
# ═══════════════════════════════════════════════════════════════════════
#
# GitHub n'est pas ponctuel à la minute : un passage peut décaler de dix à
# vingt minutes quand leurs serveurs sont chargés. L'app affiche l'âge réel
# de chaque image, jamais une fraîcheur supposée.
#
# ═════════════════════════════════════════════════════════════════════
# CE QU'ON A MESURÉ LE 26 AOÛT, ET POURQUOI ON EST REVENU À UNE HEURE
#
# Objectif de départ : rafraîchir les nuages toutes les vingt minutes.
# Deux tentatives, deux échecs, mesurés et pas supposés :
#
#   `*/20 * * * *`          → 0 déclenchement en 1 h 20
#   `5,25,45 * * * *`       → 0 déclenchement en 1 h 00 (3 créneaux ratés)
#   `0 * * * *`  (l'ancien) → 10 déclenchements d'affilée, aucun raté
#
# Le planificateur de GitHub est « au mieux » et sacrifie les cadences
# rapprochées quand la charge monte. Plutôt que de laisser un réglage
# ambitieux qui ne publie jamais rien, on remet celui qui a fait ses
# preuves sur CE dépôt.
#
# Conséquence assumée : l'image la plus fraîche a entre 15 et 75 minutes.
# C'est six fois mieux que les outils qui sortent toutes les 6 heures,
# et trois fois moins bien que ce qu'on visait.
#
# Pour descendre vraiment à vingt minutes, il faut un minuteur fiable
# hors de GitHub (Cloudflare Workers en fait un par minute, gratuitement)
# qui appelle ce flux par workflow_dispatch. Cela demande un compte
# Cloudflare et un jeton GitHub : c'est une décision de Gabin, pas une
# décision technique.
# ═════════════════════════════════════════════════════════════════════
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Deux passages qui se chevauchent se marcheraient sur les pieds au moment
# de publier. On les met à la queue leu leu.
concurrency:
  group: publication-matai
  cancel-in-progress: false

jobs:
  previsions:
    runs-on: ubuntu-latest

    # ═════════════════════════════════════════════════════════════════════
    # ⚠️  UN PASSAGE QUI SE BLOQUE BLOQUE TOUS LES SUIVANTS.
    #
    # `cancel-in-progress: false` juste au-dessus est volontaire — deux
    # publications simultanées s'écraseraient l'une l'autre. Mais la
    # conséquence, elle, ne l'était pas : un passage qui reste pendu met les
    # passages horaires suivants EN FILE derrière lui, et GitHub finit par
    # les abandonner. Un seul téléchargement qui ne rend jamais la main peut
    # donc arrêter la publication pour la journée entière.
    #
    # Sans limite ici, le plafond est celui de GitHub : six heures. Six
    # passages horaires perdus pour une image de satellite.
    #
    # Le passage complet prend deux à quatre minutes. Vingt-cinq laissent
    # toute la marge nécessaire à un jour lent et coupent net un jour pendu.
    # ═════════════════════════════════════════════════════════════════════
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      # ─────────────────────────────────────────────────────────────────
      # Le banc d'essai passe AVANT la fabrication, pas après.
      #
      # Publier puis découvrir que c'était faux ne sert à rien : les paquets
      # sont déjà en ligne et les téléphones les ont déjà pris. Une faute ici
      # arrête la publication et laisse en place ceux de l'heure précédente,
      # qui sont vieux d'une heure — bien moins grave que faux.
      #
      # Ce dépôt ne contient que le backend : les tests qui ont besoin des
      # sources de l'application se déclarent « sautés » et n'échouent pas.
      # Le jour où les deux vivront ensemble, ils s'allumeront tout seuls.
      # ─────────────────────────────────────────────────────────────────
      - name: Vérifier
        run: npm test

      # ─────────────────────────────────────────────────────────────────
      # On récupère ce qui est déjà en ligne AVANT de fabriquer.
      #
      # Sans ça, chaque passage repartirait de zéro et retéléchargerait
      # les douze images de la boucle — deux cent quarante mégaoctets pour
      # rien. Là, on ne va chercher que les deux qui manquent.
      # ─────────────────────────────────────────────────────────────────
      - name: Récupérer ce qui est déjà publié
        run: |
          rm -rf paquets
          if git fetch --depth=1 origin site; then
            git checkout FETCH_HEAD -- paquets || echo "branche site encore vide"
            git reset --quiet
          else
            echo "première publication : rien à récupérer"
          fi
          echo "images en réserve : $(ls paquets/nuages/anim/*.jpg 2>/dev/null | wc -l)"

      - name: Fabriquer
        env:
          OPEN_METEO_CLE: ${{ secrets.OPEN_METEO_CLE }}
          METEOFRANCE_CLE: ${{ secrets.METEOFRANCE_CLE }}
        # ⚠️  PAS DE CONDITION ICI. Voir l'en-tête : celle qui s'y trouvait
        # a fait tourner le flux au vert pendant trente heures sans jamais
        # refaire une prévision. Un passage par heure, complet, point.
        run: |
          echo "── passage complet : prévisions, nuages, animation, projection ──"
          node build.mjs

      # ─────────────────────────────────────────────────────────────────
      # Publication sur une branche à commit unique.
      #
      # Les images changent toutes les vingt minutes. Versionner ça dans
      # l'historique ferait grossir le dépôt d'une trentaine de mégaoctets
      # par jour — il serait ingérable en un mois.
      #
      # On écrase donc « site » avec un commit sans parent à chaque fois.
      # Le dépôt garde la taille de son contenu, pour toujours. Le code
      # source, lui, reste sur main avec son historique intact.
      # ─────────────────────────────────────────────────────────────────
      - name: Publier
        run: |
          git config user.name  "Mata'i"
          git config user.email "matai@users.noreply.github.com"
          touch .nojekyll
          git checkout --orphan publication
          git reset --quiet
          git add -f .nojekyll paquets
          git commit -q -m "Site du $(date -u '+%d/%m/%Y %H:%M') UTC"
          git push --force origin publication:site
          echo "publié : $(du -sh paquets | cut -f1)"
